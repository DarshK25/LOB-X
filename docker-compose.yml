# Optional: Postgres for the collector's trade writer (DATABASE_URL in .env).
# Everything else in LOB-X runs from local Parquet files and needs no services.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lobx}
      POSTGRES_USER: ${POSTGRES_USER:-lobx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lobx_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
