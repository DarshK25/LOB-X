name: Collect Market Data

# ─── Schedule ─────────────────────────────────────────────────────────────────
# Runs every 3 hours. Each run collects for 3h10m (10m overlap buffer).
# The concurrency group below ensures at most one collect run is active
# at a time — new runs queue instead of racing to push.
on:
  schedule:
    - cron: '0 */3 * * *'   # 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
  workflow_dispatch:         # Manual trigger (for testing / backfill)

# ─── Concurrency ──────────────────────────────────────────────────────────────
# cancel-in-progress: false → new triggers QUEUE behind the running job.
# This prevents two collectors writing conflicting artifacts simultaneously.
concurrency:
  group: market-data-collect
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  collect:
    name: Collect (${{ github.run_number }})
    runs-on: ubuntu-latest
    timeout-minutes: 205   # 3h 10m collection + 15m setup buffer

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup (3.11 — required for asyncio.TaskGroup) ──────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          cd backend/python
          pip install -e .
          cd ../..

      # ── 4. Smoke test the installation ───────────────────────────────────
      - name: Verify installation
        run: |
          python -c "import lobx; print('lobx version:', lobx.__version__)"
          python -c "from lobx.market_data.collector import Collector; print('Collector OK')"
          python -c "from lobx.storage.postgres_writer import PostgresTradeWriter; print('PostgresTradeWriter OK')"

      # ── 5. Prepare directories ────────────────────────────────────────────
      - name: Create data directories
        run: mkdir -p data/raw logs

      # ── 6. Run collector for 3h10m ────────────────────────────────────────
      #    --no-engine-mirror: C++ extension not built in CI (no compiler/cmake)
      #    DATABASE_URL: injected from repo secret for Neon PostgreSQL writes
      - name: Run collector (3h 10m)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/run_collector.py \
            --duration-seconds 11400 \
            --data-dir data/raw \
            --no-engine-mirror \
            --heartbeat 60 \
            --log-file logs/collect_${{ github.run_number }}.log

      # ── 7. Validate collected data + write GitHub Step Summary ────────────
      - name: Validate collected data
        if: always()
        run: |
          python scripts/validate_collection.py --data-dir data/raw

      # ── 8. Show log tail for debugging ────────────────────────────────────
      - name: Show collector log tail
        if: always()
        run: |
          echo "=== Last 80 lines of collector log ==="
          tail -80 logs/collect_${{ github.run_number }}.log 2>/dev/null || echo "(no log file)"

      # ── 9. Upload Parquet + logs as artifacts ─────────────────────────────
      #    Artifacts are stored by GitHub for 30 days.
      #    We do NOT commit Parquet to git — binary blobs pollute git history.
      #    Trades are ALSO written to Neon PostgreSQL for persistent long-term
      #    storage and fast SQL queries during calibration.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            data/raw/*.parquet
            logs/*.log
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
